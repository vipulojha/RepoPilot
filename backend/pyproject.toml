[project]
name = "repopilot-backend"
version = "0.1.0"
description = "Local API foundation for RepoPilot"
requires-python = ">=3.12,<3.13"
scripts = { repopilot = "app.cli:main" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<1",
  "tree-sitter-javascript>=0.25,<1",
  "tree-sitter-python>=0.25,<1",
  "tree-sitter-typescript>=0.23,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
